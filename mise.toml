[tools]
node = "24.21.0"
lefthook = "2.2.2"
uv = "0.13.7"
actionlint = "1.7.12"
pinact = "5.0.2"
shellcheck = "0.11.0"
terraform = "1.17.1"
go = "1.27.4"

[env]
_.path = ["{{config_root}}/.standards/cache/bin"]

[tasks.setup]
description = "Install repository dependencies and Git hooks"
run = ["npm ci --ignore-scripts", "lefthook install"]

[tasks."repo:lint"]
description = "Run Lefthook checks"
run = "lefthook run pre-commit --all-files --no-auto-install --fail-on-changes"

[tasks."repo:test"]
description = "Run repository regression tests"
run = ["python3 -m unittest discover -s tests -p 'test_*.py'", "npm run test:renovate", "mise run terraform-test"]

[tasks.terraform-validate]
description = "Validate all Terraform environments without AWS authentication"
run = 'PATH="$(mise where terraform):$PATH" bash scripts/validate-terraform.sh'

[tasks."repo:bootstrap"]
run = ['GOBIN="{{config_root}}/.standards/cache/bin" go install github.com/tqer39/dev-standards/cmd/dev-standards@v0.4.16', "mise run setup"]

[tasks."repo:format"]
run = ["terraform fmt -recursive terraform tests/terraform", "npx --no-install prettier --write '.github/**/*.yml' lefthook.yml", "npm run rules:generate"]

[tasks."repo:format:check"]
run = ["terraform fmt -check -recursive terraform tests/terraform", "npx --no-install prettier --check '.github/**/*.yml' lefthook.yml", "npm run rules:check"]

[tasks."repo:build"]
run = "mise run terraform-validate"

[tasks.terraform-test]
description = "AWS 認証なしでモック provider の回帰テストを実行"
run = ["terraform -chdir=tests/terraform init -backend=false -input=false -lockfile=readonly", "terraform -chdir=tests/terraform test -no-color"]

# Generated by dev-standards; edit .standards/mise.project.toml.
[task_config]
includes = ["mise-tasks", ".mise/tasks", ".config/mise/tasks", ".standards/tasks.project.toml", ".standards/tasks.standards.toml"]
