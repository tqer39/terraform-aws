---
name: set matrix
description: Select Terraform roots from the event commit range
inputs:
  AWS_ENV_NAME:
    description: AWS の環境名
    required: true
outputs:
  matrix:
    description: Terraform の実行対象ディレクトリのリスト
    value: ${{ steps.set-matrix.outputs.matrix }}
runs:
  using: composite
  steps:
    - name: Select deployment roots
      id: set-matrix
      env:
        AWS_ENV_NAME: ${{ inputs.AWS_ENV_NAME }}
      run: python3 .github/scripts/terraform_matrix.py
      shell: bash
