---
name: Setup terraform

description: Linux x64 向けの Terraform を準備

inputs:
  working-directory:
    description: Terraform CLI 実行時のパス
    required: true
  backend:
    description: backend を初期化するかどうか
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Terraform with mise
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: v2026.11.12
        sha256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
        install_args: terraform

    - name: Terraform Format
      run: terraform fmt -check -recursive -diff
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Terraform Init
      run: terraform init -backend="$TF_BACKEND" -input=false -lockfile=readonly
      env:
        TF_BACKEND: ${{ inputs.backend }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
