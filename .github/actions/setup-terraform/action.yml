---
name: Setup terraform

description: Linux x64 向けの Terraform を準備

inputs:
  working-directory:
    description: Terraform CLI 実行時のパス
    required: true
  backend:
    description: backend を初期化するかどうか
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Terraform with mise
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: v2026.11.8
        sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d
        install_args: terraform

    - name: Terraform Format
      run: terraform fmt -check -recursive -diff
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Terraform Init
      run: terraform init -backend="$TF_BACKEND" -input=false -lockfile=readonly
      env:
        TF_BACKEND: ${{ inputs.backend }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
