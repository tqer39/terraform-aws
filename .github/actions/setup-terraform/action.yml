---
name: Setup terraform

description: Setup Terraform

inputs:
  working-directory:
    description: Terraform CLI 実行時のパス
    required: true
  backend:
    description: backend を初期化するかどうか
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Terraform with mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.9.9
        sha256: bd481434a65ede6b2ec6162b88f129e5c6b94cf9de808b8ee7c6f027b13b4589
        install_args: terraform

    - name: Terraform Format
      run: terraform fmt -check -recursive -diff
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Terraform Init
      run: terraform init -backend="$TF_BACKEND" -input=false -lockfile=readonly
      env:
        TF_BACKEND: ${{ inputs.backend }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
