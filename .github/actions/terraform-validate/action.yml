---
name: Terraform Validate

description: Terraform Validate

inputs:
  working-directory:
    description: Terraform CLI 実行時のパス
    required: true

runs:
  using: composite
  steps:
    - name: Terraform Validate
      run: terraform validate -no-color
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.66.0
        checksums: |
          e2d98b60adb2602a252ee9efb036e237edf13c8fda91f4d513d3357e1a01a889
          859b26af07ead7e65cee7eec9d050b2e2571dc28395b7a39191cae088cd67803
          342387a1368b168794eacdaac586446764586f775a00eae7ffc5ee3304ca09c1
          22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
          c5b8fd360df5c5e3804fd86a072a2c02ee12e9998c7aa3cbffbc8e1b5bc42883
          1105a0a5ddee7cdac7957a3475571a946b839192ea1bc0c722c6c4686001067e
          0ffffe98b8ff1b093822f724617abc30be247f205ecb38f94e6799f829518727
          e3acd1d89c735ce6e09108c9277f26076ebeb385c1f77a73c1cbf1826ed626a7

    - name: Show version
      run: tflint --version
      shell: bash

    - name: Init TFLint
      run: tflint --init
      env:
        # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash

    - name: Run TFLint
      run: tflint --chdir="$TF_WORKING_DIRECTORY" --call-module-type=all
      env:
        TF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      shell: bash
