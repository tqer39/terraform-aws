---
name: Setup Node.js

description: Setup Node.js

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: npm ci --ignore-scripts
      shell: bash
