---
name: Setup Node.js

description: Linux x64 向けの Node.js を準備

runs:
  using: composite
  steps:
    - name: Set up Node.js with mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: v2026.11.5
        sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0
        install_args: node

    - name: Install dependencies
      run: npm ci --ignore-scripts
      shell: bash
