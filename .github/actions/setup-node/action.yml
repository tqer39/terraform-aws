---
name: Setup Node.js

description: Linux x64 向けの Node.js を準備

runs:
  using: composite
  steps:
    - name: Set up Node.js with mise
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: v2026.11.8
        sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d
        install_args: node

    - name: Install dependencies
      run: npm ci --ignore-scripts
      shell: bash
