---
name: Setup Node.js

description: Linux x64 向けの Node.js を準備

runs:
  using: composite
  steps:
    - name: Set up Node.js with mise
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: v2026.11.12
        sha256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
        install_args: node

    - name: Install dependencies
      run: npm ci --ignore-scripts
      shell: bash
