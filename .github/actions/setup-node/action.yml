---
name: Setup Node.js

description: Setup Node.js

runs:
  using: composite
  steps:
    - name: Set up Node.js with mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.9.9
        sha256: bd481434a65ede6b2ec6162b88f129e5c6b94cf9de808b8ee7c6f027b13b4589
        install_args: node

    - name: Install dependencies
      run: npm ci --ignore-scripts
      shell: bash
