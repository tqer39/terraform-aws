---
name: Terraform Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/.terraform.lock.hcl"

permissions:
  contents: read

jobs:
  terraform-provider-version:
    name: Check Terraform provider platform locks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.head_ref, 'renovate/')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get current Terraform version
        run: echo "TERRAFORM_VERSION=$(cat .terraform-version)" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check platform checksums without pushing PR code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=AM -z "$BASE_SHA"...HEAD -- terraform/envs/ > "$RUNNER_TEMP/lock-files"
          while IFS= read -r -d '' lock_file; do
            case "$lock_file" in
              terraform/envs/*/.terraform.lock.hcl)
                terraform_dir=$(dirname "$lock_file")
                terraform -chdir="$terraform_dir" init -backend=false -input=false -lockfile=readonly
                terraform -chdir="$terraform_dir" providers lock \
                  -platform=darwin_amd64 -platform=linux_amd64 \
                  -platform=darwin_arm64 -platform=windows_amd64
                ;;
            esac
          done < "$RUNNER_TEMP/lock-files"
          git diff --exit-code -- ':(glob)**/.terraform.lock.hcl'
