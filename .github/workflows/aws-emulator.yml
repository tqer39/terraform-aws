name: AWS Emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/aws-emulator.yml"
      - ".standards/mise.project.toml"
      - "mise.toml"
      - "scripts/test-aws-emulator.py"
      - "tests/aws-emulator/**"
      - "tests/test_aws_emulator.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-emulator.yml"
      - ".standards/mise.project.toml"
      - "mise.toml"
      - "scripts/test-aws-emulator.py"
      - "tests/aws-emulator/**"
      - "tests/test_aws_emulator.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: v2026.11.8
          sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d
          install_args: terraform

      - name: DynamoDB・SQS の API 互換性を検証
        run: mise run aws-emulator-test
