name: AWS Emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/aws-emulator.yml"
      - ".standards/mise.project.toml"
      - "mise.toml"
      - "scripts/test-aws-emulator.py"
      - "tests/aws-emulator/**"
      - "tests/test_aws_emulator.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-emulator.yml"
      - ".standards/mise.project.toml"
      - "mise.toml"
      - "scripts/test-aws-emulator.py"
      - "tests/aws-emulator/**"
      - "tests/test_aws_emulator.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: v2026.11.12
          sha256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
          install_args: terraform

      - name: DynamoDB・SQS の API 互換性を検証
        run: mise run aws-emulator-test
