name: Test Setup Repository Script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select setup profile
        id: profile
        run: python3 .github/scripts/setup_profile.py

  test-setup-repository-linux:
    needs: [setup-profile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful profile selection
        env:
          PROFILE_RESULT: ${{ needs.setup-profile.result }}
        run: test "$PROFILE_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.9
          sha256: bd481434a65ede6b2ec6162b88f129e5c6b94cf9de808b8ee7c6f027b13b4589
          install: false

      - name: Set up repository
        env:
          SETUP_PROFILE: ${{ needs.setup-profile.outputs.profile }}
        run: mise run install

      - name: Verify aws-vault installation
        run: aws-vault --version

  test-setup-repository-macos:
    needs: [setup-profile]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Require successful profile selection
        env:
          PROFILE_RESULT: ${{ needs.setup-profile.result }}
        run: test "$PROFILE_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.9
          sha256: 1998d23853aac289cef2a7858cab86b082f603c98b0bc792245f01301312f4cb
          install: false

      - name: Set up repository
        env:
          SETUP_PROFILE: ${{ needs.setup-profile.outputs.profile }}
        run: mise run install

      - name: Verify aws-vault installation
        run: aws-vault --version
