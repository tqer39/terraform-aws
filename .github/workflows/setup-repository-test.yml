name: Test Setup Repository Script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select setup profile
        id: profile
        run: python3 .github/scripts/setup_profile.py

  test-setup-repository-linux:
    needs: [setup-profile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful profile selection
        env:
          PROFILE_RESULT: ${{ needs.setup-profile.result }}
        run: test "$PROFILE_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Set up repository
        env:
          SETUP_PROFILE: ${{ needs.setup-profile.outputs.profile }}
        run: mise run install

      - name: Verify aws-vault installation
        run: aws-vault --version

  test-setup-repository-macos:
    needs: [setup-profile]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Require successful profile selection
        env:
          PROFILE_RESULT: ${{ needs.setup-profile.result }}
        run: test "$PROFILE_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Set up repository
        env:
          SETUP_PROFILE: ${{ needs.setup-profile.outputs.profile }}
        run: mise run install

      - name: Verify aws-vault installation
        run: aws-vault --version
