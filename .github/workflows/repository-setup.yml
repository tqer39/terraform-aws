name: Repository Setup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 対応する runner を確認
        id: verify-runner
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64|macOS/ARM64) ;;
            *) echo "対応する mise のチェックサムがありません: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac

      # Renovate が OS ごとの版とチェックサムの組を更新できるようにする。
      - name: Linux の mise を準備
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: v2026.11.5
          sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0

      - name: macOS の mise を準備
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: v2026.11.5
          sha256: 4f9faebcfac7f8bb1321e697ba7a5ba26f645233aa269741a16482f757bd482e

      - name: Set up repository
        run: |
          mise run bootstrap
          mise run bootstrap

      - name: Verify repository setup
        run: |
          mise exec -- terraform version
          mise exec -- npx --no-install prettier --version
          test -x "$(git rev-parse --git-path hooks/pre-commit)"

      - name: Test repository task behavior
        run: python3 -m unittest discover -s tests -p 'test_mise_tasks.py'
