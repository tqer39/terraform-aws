name: Repository Setup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 対応する runner を確認
        id: verify-runner
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64|macOS/ARM64) ;;
            *) echo "対応する mise のチェックサムがありません: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac

      # Renovate が OS ごとの版とチェックサムの組を更新できるようにする。
      - name: Linux の mise を準備
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: v2026.11.8
          sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d

      - name: macOS の mise を準備
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: v2026.11.8
          sha256: 3e390ecbcf7f03e91e72c920a248a0f149f00d77ae95d37ea1736a1c7b42fee6

      - name: Set up repository
        run: |
          mise run bootstrap
          mise run bootstrap

      - name: Verify repository setup
        run: |
          mise exec -- terraform version
          mise exec -- npx --no-install prettier --version
          test -x "$(git rev-parse --git-path hooks/pre-commit)"

      - name: Test repository task behavior
        run: python3 -m unittest discover -s tests -p 'test_mise_tasks.py'
