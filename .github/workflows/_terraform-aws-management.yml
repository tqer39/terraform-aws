---
name: Terraform - AWS - Management

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      CHECK_DIFF:
        description: "差分チェックフラグ"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      CHECK_DIFF:
        description: "差分チェックフラグ"
        required: true
        type: choice
        default: "_true"
        options:
          - "_true"
          - "_false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: 577523824419
  AWS_ENV_NAME: management
  OIDC_IAM_ROLE: management-terraform-aws-deploy
  CHECK_DIFF: ${{ inputs.CHECK_DIFF || github.event.inputs.CHECK_DIFF || '_true' }}

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/set-matrix
        id: set-matrix
        with:
          AWS_ENV_NAME: ${{ env.AWS_ENV_NAME }}

  terraform-pr-validation:
    needs: [set-matrix]
    if: github.event_name == 'pull_request' && needs.set-matrix.outputs.matrix != '["_empty"]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
        with:
          backend: "false"
          working-directory: ./terraform/envs/${{ env.AWS_ENV_NAME }}/${{ matrix.directory }}
      - uses: ./.github/actions/terraform-validate
        with:
          working-directory: ./terraform/envs/${{ env.AWS_ENV_NAME }}/${{ matrix.directory }}

  terraform-aws-management:
    needs: [set-matrix]
    if: ${{ vars.TERRAFORM_EXECUTION_ENABLED == 'true' && needs.set-matrix.outputs.matrix != '["_empty"]' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For aws-actions/configure-aws-credentials
      contents: read # For aws-actions/configure-aws-credentials
      deployments: write # For bobheadxi/deployments
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.set-matrix.outputs.matrix )}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/aws-credential
        with:
          oidc-iam-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_IAM_ROLE }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ENV_NAME: ${{ env.AWS_ENV_NAME }}
          CHECK_DIFF: ${{ env.CHECK_DIFF }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          working-directory: ./terraform/envs/${{ env.AWS_ENV_NAME }}/${{ matrix.directory }}

      - name: Start Deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.CHECK_DIFF == '_false' && env.TF_PLAN_STATUS == 'has-diff'
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.AWS_ENV_NAME }}

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.CHECK_DIFF == '_false' && env.TF_PLAN_STATUS == 'has-diff'
        uses: ./.github/actions/terraform-apply
        with:
          working-directory: ./terraform/envs/${{ env.AWS_ENV_NAME }}/${{ matrix.directory }}

      - name: Finish Deployment
        if: always() && steps.deployment.outputs.deployment_id != ''
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

  workflow-result-terraform-aws-management:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [set-matrix, terraform-pr-validation, terraform-aws-management]
    if: always()
    steps:
      - name: Failure
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: |
          echo "workflow failure"
          exit 1
      - name: Success
        run: |
          echo "workflow success"
