---
name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rulesync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Check generated AI rules
        run: npm run rules:check

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Test Terraform workflow change detection
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: -a --show-diff-on-failure

  workflow-result:
    needs: [pre-commit, rulesync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.pre-commit.result }}
          RULESYNC_RESULT: ${{ needs.rulesync.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$RULESYNC_RESULT" = success
