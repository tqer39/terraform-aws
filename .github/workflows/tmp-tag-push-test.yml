---
name: tag push test

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag-push-test:
    environment:
      name: test-tag-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tag push
        run: |
          echo "tag push"
