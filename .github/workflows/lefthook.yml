---
name: Lefthook

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rulesync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Test rule generation and skill references
        run: python3 -m unittest discover -s tests -p 'test_rulesync.py'
      - name: Check generated AI rules
        run: npm run rules:check

  lefthook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.9
          sha256: bd481434a65ede6b2ec6162b88f129e5c6b94cf9de808b8ee7c6f027b13b4589

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test repository tasks and Terraform workflow change detection
        run: mise run test

      - name: Run Lefthook checks
        run: mise run lint

  workflow-result:
    needs: [lefthook, rulesync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.lefthook.result }}
          RULESYNC_RESULT: ${{ needs.rulesync.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$RULESYNC_RESULT" = success
