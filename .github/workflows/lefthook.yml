---
name: Lefthook

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rulesync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Check generated AI rules
        run: npm run rules:check

  lefthook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up mise
        uses: jdx/mise-action@v4

      - uses: ./.github/actions/setup-node

      - name: Test Terraform workflow change detection
        run: mise run test

      - name: Run Lefthook checks
        run: mise run lint

  workflow-result:
    needs: [lefthook, rulesync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.lefthook.result }}
          RULESYNC_RESULT: ${{ needs.rulesync.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$RULESYNC_RESULT" = success
