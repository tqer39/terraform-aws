---
name: Generate terraform docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-docs.yml"
  push:
    branches:
      - "test/terraform-docs/**"
    paths:
      - "**.tf"
      - ".github/workflows/terraform-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-docs-${{ github.ref }}

jobs:
  terraform-docs:
    name: terraform docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: modules
            directory: modules

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The upstream action references a mutable container tag, so pin the image directly.
      - name: Check generated terraform docs
        uses: docker://quay.io/terraform-docs/gh-actions@sha256:dc6d26571aa486ff195851a75ba6be55b5c3b99078581405e0b8190c0b331c35 # 1.3.0
        env:
          INPUT_FIND_DIR: "./terraform/${{ matrix.directory }}"
          INPUT_ATLANTIS_FILE: disabled
          INPUT_CONFIG_FILE: disabled
          INPUT_OUTPUT_FORMAT: markdown table
          INPUT_INDENTION: "2"
          INPUT_OUTPUT_FILE: USAGE.md
          INPUT_OUTPUT_METHOD: inject
          INPUT_GIT_PUSH: "false"
          INPUT_FAIL_ON_DIFF: "true"
          INPUT_ARGS: --hide-empty
